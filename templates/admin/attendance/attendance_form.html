{% extends "base/base.html" %}

{% block title %}{{ title }} - HostelPulse{% endblock %}
{% block page_title %}{{ title }}{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-lg-6">
    <div class="dashboard-card">
      <div class="dashboard-card-header">
        <h5 class="dashboard-card-title">
          <i class="fa-solid fa-calendar-check text-primary"></i> {{ title }}
        </h5>
        <a href="{% url 'attendance:attendance_list' %}" class="btn btn-sm btn-secondary-custom">
          <i class="fa-solid fa-arrow-left"></i> Back to Attendance
        </a>
      </div>
      <div class="dashboard-card-body">
        <form method="post">
          {% csrf_token %}
          <div class="mb-3">
            <label class="form-label">Student <span class="text-danger">*</span></label>
            {{ form.student }}
          </div>
          <div class="row g-3 mb-3">
            <div class="col-md-6">
              <label class="form-label">Date <span class="text-danger">*</span></label>
              {{ form.date }}
            </div>
            <div class="col-md-6">
              <label class="form-label">Status <span class="text-danger">*</span></label>
              {{ form.status }}
            </div>
          </div>
          <div class="mb-3">
            <label class="form-label">Remarks (Optional)</label>
            {{ form.remarks }}
          </div>

          <div class="d-flex justify-content-end gap-2 mt-4 pt-3 border-top">
            <a href="{% url 'attendance:attendance_list' %}" class="btn btn-secondary-custom">Cancel</a>
            <button type="submit" class="btn btn-primary-custom">
              <i class="fa-solid fa-floppy-disk me-1"></i> Save Attendance
            </button>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
